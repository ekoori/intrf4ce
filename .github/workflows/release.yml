# A tag such as v0.2.0 makes a release: tested, packaged as one self-contained executable for
# Windows x64 — the platform that has been verified — and attached with notes from the commits.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test --nologo
      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/package.ps1 -Runtime win-x64 -Version $version
          Copy-Item dist/win-x64/intrf4ce.exe intrf4ce-win-x64.exe
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' intrf4ce-win-x64.exe --title '${{ github.ref_name }}' --generate-notes
